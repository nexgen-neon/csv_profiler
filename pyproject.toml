[project]
name = "data-profiler"
version = "0.1.0"
description = "A scalable data profiling application for CSV files and PostgreSQL databases"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.5.0",
    "streamlit>=1.48.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example"]